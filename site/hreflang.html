<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hreflang without reciprocals</title>
  <meta name="description" content="Alternate links that do not reference each other.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hreflang without reciprocals">
  <meta property="og:image" content="http://127.0.0.1:8907/og.png">
  <meta property="og:description" content="Alternate links that do not reference each other.">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <h1>Hreflang fixtures</h1>
  <!-- PLANTED: hreflang alternates with no x-default, and a page in the set
       that does not link back to this one -->
  <link rel="alternate" hreflang="fr" href="https://testbed.example/fr">
  <link rel="alternate" hreflang="de" href="https://testbed.example/de">
  <p>Two alternates, no x-default, and neither alternate links back here.</p>
</body>
</html>
