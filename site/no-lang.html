<html>
<head>
  <meta charset="utf-8">

  <meta property="og:title" content="Missing language attribute">
  <meta property="og:image" content="http://127.0.0.1:8904/og.png">

  <meta name="twitter:description" content="The html element has no lang attribute.">
  <title>Missing language attribute</title>
  <meta name="description" content="The html element has no lang attribute.">
</head>
<body>
  <h1>No lang attribute</h1>
  <p>Screen readers cannot pick a pronunciation dictionary.</p>
  <!-- PLANTED: link with no accessible name (image with empty alt inside a link) -->
  <a href="/clean.html"><img src="button.png" alt=""></a>
  <!-- PLANTED: external link with no rel="noopener" and target=_blank -->
  <a href="https://example.com" target="_blank">External, opens a new tab</a>
</body>
</html>
